name: Relatório

# Avalia as duas versões do bot, falha se a versão nova regredir
# e anexa o relatório HTML à execução (aba Actions > Artifacts).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  avaliar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Avaliar versão base (v1) e versão nova (v2)
        run: |
          mkdir -p site
          atendimento-eval avaliar data/conversas_v1.jsonl --saida v1.json --html site/antes.html
          atendimento-eval avaliar data/conversas_v2.jsonl --saida v2.json --html site/depois.html --base v1.json
      - name: Checar regressões
        run: atendimento-eval comparar v1.json v2.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio
          path: site
