[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atendimento-eval"
version = "0.2.0"
description = "Avaliação de qualidade de atendimento com checagens determinísticas e LLM-as-judge"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arthur Penedo" }]
dependencies = ["pydantic>=2.6", "pyyaml>=6"]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
dev = ["pytest>=8", "ruff>=0.6", "anthropic>=1.0"]

[project.scripts]
atendimento-eval = "atendimento_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atendimento_eval = ["rubricas/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
